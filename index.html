<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f3b73">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="乾燥機OK服">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>乾燥機OKな服ギャラリー｜楽さん用</title>
<style>
:root{
  --bg:#f6f7f9;--card:#fff;--ink:#1d232b;--muted:#6b7480;--line:#e3e6ea;--accent:#2f6fec;
  --ok:#1f9d55;--ok-bg:#e3f6ea;--unk:#a66b00;--unk-bg:#fff4d1;--ng:#d0342c;--ng-bg:#fde6e4;
  --radius:14px;--shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
header.top{background:linear-gradient(135deg,#1f3b73,#2f6fec);color:#fff;padding:22px 20px 18px}
.wrap{max-width:1200px;margin:0 auto}
header.top h1{margin:0;font-size:clamp(20px,3.2vw,28px);letter-spacing:.02em}
header.top p{margin:4px 0 0;opacity:.85;font-size:14px}
.toolbar{position:sticky;top:0;z-index:20;background:rgba(246,247,249,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.toolbar .wrap{padding:12px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 240px;position:relative}
.search input{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
select,input,textarea,button{font:inherit}
.ctl{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px;color:var(--ink)}
.price{display:flex;align-items:center;gap:4px}
.price input{width:92px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-size:14px;cursor:pointer;color:var(--ink);white-space:nowrap}
.btn:hover{background:#f0f2f5}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#255fd0}
.btn.danger{color:var(--ng);border-color:#f3c2be}
.btn.small{padding:6px 10px;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;user-select:none}
.chip[aria-pressed="true"].s-ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.chip[aria-pressed="true"].s-unknown{background:var(--unk-bg);border-color:#e0b100;color:var(--unk)}
.chip[aria-pressed="true"].s-ng{background:var(--ng-bg);border-color:var(--ng);color:var(--ng)}
.more{display:none}
.summary{max-width:1200px;margin:0 auto;padding:14px 20px 0;color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
main .grid{max-width:1200px;margin:0 auto;padding:14px 20px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;border:1px solid #eef0f3;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(16,24,40,.06),0 10px 24px rgba(16,24,40,.1)}
.thumb{position:relative;aspect-ratio:1/1;background:#f1f3f5;display:block}
.thumb img{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
.badge{position:absolute;left:10px;top:10px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.b-ok{background:var(--ok-bg);color:var(--ok);border:1px solid #9fdcb6}
.b-unknown{background:var(--unk-bg);color:var(--unk);border:1px solid #f0d27a}
.b-ng{background:var(--ng-bg);color:var(--ng);border:1px solid #f3b3ad}
.mine{position:absolute;right:10px;top:10px;font-size:11px;background:#1d232b;color:#fff;padding:3px 8px;border-radius:999px}
.sale{position:absolute;right:10px;bottom:10px;font-size:12px;font-weight:700;background:var(--ng);color:#fff;padding:3px 8px;border-radius:6px}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.brand{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.name{font-size:15px;font-weight:700;margin:0;line-height:1.4}
.prices{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.prices .now{font-size:18px;font-weight:800}
.prices .now.onsale{color:var(--ng)}
.prices .list{font-size:13px;color:var(--muted);text-decoration:line-through}
.meta{font-size:13px;color:#39424e;display:grid;grid-template-columns:auto 1fr;gap:2px 8px}
.meta dt{color:var(--muted)}
.meta dd{margin:0}
.evidence{font-size:11.5px;color:#5b6573;border-left:3px solid #d5dbe3;padding:2px 0 2px 8px;margin:0;line-height:1.45}
.evidence b{color:#39424e;font-weight:600}
.catbar{max-width:1200px;margin:0 auto;padding:12px 20px 0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.catbar::-webkit-scrollbar{display:none}
.catchip{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--ink)}
.catchip small{color:var(--muted);margin-left:4px}
.catchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.catchip[aria-pressed="true"] small{color:#cfd5dd}
.note{font-size:13px;color:#4a5361;background:#f6f7f9;border-radius:8px;padding:6px 9px;margin:0}
.actions{margin-top:auto;padding-top:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.actions .link{flex:1;text-align:center;text-decoration:none;background:var(--ink);color:#fff;border-radius:9px;padding:8px 10px;font-size:13px;font-weight:600}
.actions .link:hover{background:#000}
.actions .nolink{flex:1;text-align:center;font-size:12px;color:var(--muted)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 10px}
dialog{border:none;border-radius:16px;padding:0;width:min(560px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(15,20,30,.45)}
dialog form{padding:20px}
dialog h2{margin:0 0 12px;font-size:18px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.fgrid label.full{grid-column:1/-1}
.fgrid input,.fgrid select,.fgrid textarea{padding:9px 10px;border:1px solid var(--line);border-radius:9px;font-size:15px;color:var(--ink);background:#fff}
.fgrid textarea{min-height:64px;resize:vertical}
.req{color:var(--ng)}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.preview{grid-column:1/-1;display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted)}
.preview img{width:64px;height:64px;object-fit:contain;border:1px solid var(--line);border-radius:8px;background:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#1d232b;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
footer{max-width:1200px;margin:0 auto;padding:0 20px 30px;color:var(--muted);font-size:12px}
@media (max-width:720px){
  .catbar{padding:10px 12px 0}
  .evidence{font-size:11px}
  .toolbar .wrap{gap:8px;padding:10px 12px}
  .more-toggle{display:inline-block}
  .more{display:none;width:100%;flex-wrap:wrap;gap:8px}
  .more.open{display:flex}
  .more .ctl{flex:1 1 140px}
  .price{flex:1 1 100%}
  .price input{flex:1;width:auto}
  main .grid{grid-template-columns:repeat(2,1fr);gap:10px;padding:10px 12px 30px}
  .body{padding:10px}
  .name{font-size:13px}
  .prices .now{font-size:16px}
  .meta{font-size:12px;grid-template-columns:1fr}
  .meta dt{display:none}
  .note{font-size:12px}
  .badge{font-size:10px;padding:3px 7px;left:6px;top:6px}
  .fgrid{grid-template-columns:1fr}
  .summary{padding:10px 12px 0}
}
@media (min-width:721px){.more{display:contents}.more-toggle{display:none}}
@media (max-width:380px){main .grid{grid-template-columns:1fr}}

/* ---- cart (気になるリスト) ---- */
.cartbtn{position:relative;display:inline-flex;align-items:center;gap:6px}
.cartbtn .cnt{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--ng);color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.cartbtn .cnt.zero{background:#c3c9d1}
.chip.c-cart[aria-pressed="true"]{background:#fff1e0;border-color:#e8892b;color:#b85c00}
.actions .cart-add{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--ink)}
.actions .cart-add:hover{background:#f6f2ea}
.actions .cart-add.in{background:#fff1e0;border-color:#e8892b;color:#b85c00;font-weight:700}
.card.incart{outline:2px solid #f3b36b}
.incart-tag{position:absolute;right:10px;top:10px;font-size:11px;background:#e8892b;color:#fff;padding:3px 8px;border-radius:999px}
.card .mine+.incart-tag{top:34px}
.cart-ov{position:fixed;inset:0;background:rgba(15,20,30,.4);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.cart-ov.open{opacity:1;pointer-events:auto}
.cart{position:fixed;top:0;right:0;height:100%;width:min(420px,100vw);background:#fff;z-index:61;box-shadow:-10px 0 40px rgba(0,0,0,.18);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .25s ease}
.cart.open{transform:none}
.cart-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.cart-h h2{margin:0;font-size:17px}
.cart-h .x{border:none;background:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1;padding:4px 8px}
.cart-sub{font-size:12px;color:var(--muted);padding:6px 16px 0}
.cart-list{flex:1;overflow-y:auto;padding:8px 12px;margin:0;list-style:none}
.cart-item{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:10px 4px;border-bottom:1px solid #f0f2f5}
.cart-item img{width:64px;height:64px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px}
.cart-item .ci-brand{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.cart-item .ci-name{font-size:13.5px;font-weight:700;line-height:1.35;margin:1px 0 3px}
.cart-item .ci-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px}
.cart-item .ci-price{font-weight:800;font-size:14px}
.cart-item .ci-st{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px}
.cart-item input.memo{grid-column:2;width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-size:13px;margin-top:4px}
.cart-item .ci-acts{display:flex;gap:10px;align-items:center;margin-top:4px;font-size:12.5px}
.cart-item .ci-acts button{border:none;background:none;color:var(--ng);cursor:pointer;padding:0;font-size:12.5px}
.cart-empty{text-align:center;color:var(--muted);padding:50px 10px;font-size:14px}
.cart-f{border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.cart-total{display:flex;justify-content:space-between;align-items:baseline;font-size:14px}
.cart-total b{font-size:20px}
.cart-f .row{display:flex;gap:8px}
.cart-f .row .btn{flex:1}
.cart-note{font-size:11px;color:var(--muted);margin:0}
@media (max-width:720px){
  .cart{top:auto;bottom:0;left:0;right:0;width:100%;height:auto;max-height:85vh;border-radius:16px 16px 0 0;transform:translateY(105%);box-shadow:0 -10px 40px rgba(0,0,0,.2)}
  .cart.open{transform:none}
  .cart-h{position:relative;padding-top:18px}
  .cart-h::before{content:"";position:absolute;left:50%;top:7px;width:40px;height:4px;border-radius:4px;background:#d5dbe3;transform:translateX(-50%)}
  .actions .cart-add{padding:6px 8px;font-size:12px}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <h1>乾燥機OKな服ギャラリー</h1>
  <p>楽さん用 ・ タンブル乾燥に対応しているかを一覧でチェック</p>
</div></header>

<div class="toolbar"><div class="wrap">
  <div class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="ブランド・商品名・素材・メモで検索" aria-label="検索">
  </div>
  <div class="chips" id="statusChips" role="group" aria-label="乾燥機ステータス">
    <span class="chip s-ok" data-s="ok" aria-pressed="false" role="button" tabindex="0">乾燥機OK</span>
    <span class="chip s-unknown" data-s="unknown" aria-pressed="false" role="button" tabindex="0">未確認</span>
    <span class="chip s-ng" data-s="ng" aria-pressed="false" role="button" tabindex="0">NG</span>
    <span class="chip c-cart" id="cartOnly" aria-pressed="false" role="button" tabindex="0">🛒 カートのみ表示</span>
  </div>
  <button class="btn more-toggle" id="moreToggle" type="button">絞り込み ▾</button>
  <div class="more" id="more">
    <select id="brand" class="ctl" aria-label="ブランド"><option value="">すべてのブランド</option></select>
    <select id="cat" class="ctl" aria-label="カテゴリ"><option value="">すべてのカテゴリ</option></select>
    <div class="price"><input id="pmin" class="ctl" type="number" inputmode="numeric" min="0" step="100" placeholder="¥ 下限" aria-label="価格下限"><span>〜</span><input id="pmax" class="ctl" type="number" inputmode="numeric" min="0" step="100" placeholder="¥ 上限" aria-label="価格上限"></div>
    <select id="sort" class="ctl" aria-label="並び替え">
      <option value="default">おすすめ順（OK優先）</option>
      <option value="price-asc">価格が安い順</option>
      <option value="price-desc">価格が高い順</option>
      <option value="added">登録順</option>
    </select>
    <button class="btn" id="reset" type="button">リセット</button>
  </div>
  <button class="btn cartbtn" id="cartBtn" type="button" aria-haspopup="dialog" aria-controls="cart">🛒 カート <span class="cnt zero" id="cartCount">0</span></button>
  <button class="btn primary" id="addBtn" type="button">＋ アイテム追加</button>
</div></div>

<nav class="catbar" id="catbar" aria-label="カテゴリ"></nav>

<div class="summary"><span id="count"></span>
  <span>
    <button class="btn small" id="exportBtn" type="button">JSONエクスポート</button>
    <button class="btn small" id="importBtn" type="button">JSONインポート</button>
    <input id="importFile" type="file" accept="application/json,.json" hidden>
  </span>
</div>

<main><div class="grid" id="grid"></div></main>

<footer>
  価格・在庫・洗濯表示は登録時点の情報です。購入前に各商品ページで最新情報をご確認ください。追加したアイテムはこのブラウザ（localStorage）に保存されます。
</footer>

<dialog id="dlg">
  <form id="form" method="dialog">
    <h2 id="dlgTitle">アイテム追加</h2>
    <div class="fgrid">
      <label class="full">商品URL<input name="url" type="url" placeholder="https://..."></label>
      <label>ブランド <span class="req">*</span><input name="brand" required list="brandList"></label>
      <label>カテゴリ<input name="category" list="catList" placeholder="ロンT"></label>
      <label class="full">商品名 <span class="req">*</span><input name="name" required></label>
      <label>価格（税込・円） <span class="req">*</span><input name="price" type="number" min="0" step="1" required></label>
      <label>定価（セール時のみ）<input name="listPrice" type="number" min="0" step="1"></label>
      <label>素材<input name="fabric" placeholder="ポリエステル100%"></label>
      <label>乾燥機ステータス
        <select name="status">
          <option value="ok">乾燥機OK（公式確認）</option>
          <option value="unknown" selected>未確認</option>
          <option value="ng">NG</option>
        </select>
      </label>
      <label class="full">ステータス補足<input name="statusDetail" placeholder="例：低温OK（公式）/ 洗濯表示で不可"></label>
      <label class="full">根拠・出典メモ<input name="evidence" placeholder="例：公式ページの洗濯表示「タンブル乾燥（低温）」"></label>
      <label class="full">メモ<textarea name="note" placeholder="厚さ・シルエット・在庫など"></textarea></label>
      <label class="full">画像URL<input name="image" type="url" placeholder="https://...jpg"></label>
      <div class="preview"><img id="pv" alt=""><span>画像プレビュー（読み込めない場合はプレースホルダー表示）</span></div>
    </div>
    <input type="hidden" name="id">
    <div class="dlg-actions">
      <button class="btn" value="cancel" type="button" id="cancelBtn">キャンセル</button>
      <button class="btn primary" type="submit" id="saveBtn">保存</button>
    </div>
  </form>
</dialog>
<datalist id="brandList"></datalist><datalist id="catList"></datalist>
<div class="cart-ov" id="cartOv"></div>
<aside class="cart" id="cart" role="dialog" aria-modal="true" aria-labelledby="cartTitle" aria-hidden="true">
  <div class="cart-h"><h2 id="cartTitle">🛒 カート（気になるリスト）</h2><button class="x" id="cartClose" type="button" aria-label="閉じる">×</button></div>
  <div class="cart-sub" id="cartSub"></div>
  <ul class="cart-list" id="cartList"></ul>
  <div class="cart-f">
    <div class="cart-total"><span>合計（<span id="cartN">0</span>点）</span><b id="cartTotal">¥0</b></div>
    <div class="row"><button class="btn primary" id="cartCopy" type="button">📋 リストをコピー</button><button class="btn danger" id="cartClear" type="button">すべて削除</button></div>
    <p class="cart-note">購入機能ではありません（候補リスト）。購入は各商品ページで。カートはこのブラウザに保存されます。</p>
  </div>

<script>
(function(){
'use strict';
var PLACEHOLDER = 'images/placeholder.svg';
var LS_KEY = 'dryerGallery.userItems.v1';
var CART_KEY = 'dryerGallery.cart.v1';
var STATUS = {
  ok:{label:'乾燥機OK（公式確認）',short:'乾燥機OK',cls:'b-ok',rank:0},
  unknown:{label:'未確認',short:'未確認',cls:'b-unknown',rank:1},
  ng:{label:'NG',short:'NG',cls:'b-ng',rank:2}
};
var $ = function(s){return document.querySelector(s);};
var seed = [], user = [], cart = [];
var state = {q:'',statuses:[],brand:'',cat:'',pmin:null,pmax:null,sort:'default',cartOnly:false};

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function yen(n){return '¥'+Number(n).toLocaleString('ja-JP');}
function safeUrl(u){return /^https?:\/\//i.test(String(u||''))?u:'';}
function safeImg(u){u=String(u||'');return (/^(https?:|data:image\/|images\/)/i.test(u))?u:'';}
function num(v){if(v===''||v==null)return null;var n=Number(v);return isFinite(n)?n:null;}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('show');},2200);}

function loadUser(){try{var a=JSON.parse(localStorage.getItem(LS_KEY)||'[]');return Array.isArray(a)?a:[];}catch(e){return [];}}
function saveUser(){try{localStorage.setItem(LS_KEY,JSON.stringify(user));}catch(e){toast('保存に失敗しました（ストレージ不可）');}}
// --- cart (shortlist; keyed by item id) ---
function loadCart(){try{var a=JSON.parse(localStorage.getItem(CART_KEY)||'[]');return Array.isArray(a)?a.filter(function(c){return c&&c.id;}).map(function(c){return {id:String(c.id),memo:String(c.memo||''),addedAt:c.addedAt||new Date().toISOString()};}):[];}catch(e){return [];}}
function saveCart(){try{localStorage.setItem(CART_KEY,JSON.stringify(cart));}catch(e){toast('カートを保存できませんでした');}}
function cartIdx(id){for(var i=0;i<cart.length;i++)if(cart[i].id===id)return i;return -1;}
function inCart(id){return cartIdx(id)>=0;}
function byId(){var m={};all().forEach(function(x){m[x.id]=x;});return m;}
function cartRows(){var m=byId();return cart.map(function(c){return {c:c,x:m[c.id]};}).filter(function(r){return r.x;});}
function toggleCart(id){var i=cartIdx(id);if(i>=0){cart.splice(i,1);toast('カートから外しました');}else{cart.push({id:id,memo:'',addedAt:new Date().toISOString()});toast('カートに入れました');}saveCart();render();}
function renderCart(){
  var rows=cartRows(),n=rows.length,total=0,noPrice=0;
  rows.forEach(function(r){if(r.x.price!=null)total+=r.x.price;else noPrice++;});
  var cc=$('#cartCount');cc.textContent=n;cc.classList.toggle('zero',n===0);
  $('#cartN').textContent=n;$('#cartTotal').textContent=yen(total);
  var ok=rows.filter(function(r){return r.x.status==='ok';}).length;
  $('#cartSub').textContent=n?('乾燥機OK '+ok+'点・未確認/NG '+(n-ok)+'点'+(noPrice?'（価格未登録 '+noPrice+'点は合計に含まず）':'')):'';
  $('#cartList').innerHTML=n?rows.map(function(r){
    var x=r.x,st=STATUS[x.status],url=safeUrl(x.url),img=safeImg(x.image)||PLACEHOLDER;
    var onsale=x.listPrice&&x.price!=null&&x.listPrice>x.price;
    return '<li class="cart-item" data-id="'+esc(x.id)+'"><img src="'+esc(img)+'" alt="" onerror="this.onerror=null;this.src=PLACEHOLDER_SRC"><div>'+
      '<div class="ci-brand">'+esc(x.brand)+'</div><div class="ci-name">'+esc(x.name)+'</div>'+
      '<div class="ci-row"><span class="ci-price"'+(onsale?' style="color:var(--ng)"':'')+'>'+(x.price!=null?yen(x.price):'価格未登録')+'</span>'+(onsale?'<s style="color:var(--muted)">'+yen(x.listPrice)+'</s>':'')+
      '<span class="ci-st '+st.cls+'">'+esc(st.short)+'</span></div>'+
      '<input class="memo" type="text" placeholder="サイズ・色メモ（例：M / ネイビー）" value="'+esc(r.c.memo)+'" aria-label="サイズ・色メモ">'+
      '<div class="ci-acts">'+(url?'<a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">商品ページ ↗</a>':'')+'<button type="button" data-act="rm">削除</button></div>'+
      '</div></li>';}).join(''):'<li class="cart-empty">カートは空です。<br>カードの「🛒 カートに入れる」で追加できます。</li>';
}
function openCart(){renderCart();$('#cart').classList.add('open');$('#cartOv').classList.add('open');$('#cart').setAttribute('aria-hidden','false');setTimeout(function(){$('#cartClose').focus();},30);}
function closeCart(){$('#cart').classList.remove('open');$('#cartOv').classList.remove('open');$('#cart').setAttribute('aria-hidden','true');}
function cartText(){
  var rows=cartRows(),total=0;
  var lines=rows.map(function(r,i){var x=r.x;if(x.price!=null)total+=x.price;
    return (i+1)+'. '+x.brand+' '+x.name+'　'+(x.price!=null?yen(x.price):'価格未登録')+'　['+STATUS[x.status].short+']'+(r.c.memo?'　メモ：'+r.c.memo:'')+(x.url?'\n   '+x.url:'');});
  return '【気になるリスト】'+rows.length+'点　合計 '+yen(total)+'\n'+lines.join('\n');
}
function copyText(s){
  if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(s);
  return new Promise(function(res,rej){var ta=document.createElement('textarea');ta.value=s;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')?res():rej();}catch(e){rej(e);}ta.remove();});
}
function all(){
  return seed.map(function(x,i){return Object.assign({},x,{_src:'seed',_order:i});})
    .concat(user.map(function(x,i){return Object.assign({},x,{_src:'user',_order:1000+i});}));
}
function normalize(x){
  return {
    id:String(x.id||('u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6))),
    category:String(x.category||'').trim()||'未分類',
    brand:String(x.brand||'').trim(),name:String(x.name||'').trim(),
    url:String(x.url||'').trim(),price:num(x.price),listPrice:num(x.listPrice),
    fabric:String(x.fabric||'').trim(),
    status:STATUS[x.status]?x.status:'unknown',
    statusDetail:String(x.statusDetail||'').trim(),
    note:String(x.note||'').trim(),evidence:String(x.evidence||'').trim(),image:String(x.image||'').trim(),
    addedAt:x.addedAt||new Date().toISOString()
  };
}

function fillSelect(sel,values,allLabel){
  var cur=sel.value;sel.innerHTML='<option value="">'+allLabel+'</option>'+values.map(function(v){return '<option>'+esc(v)+'</option>';}).join('');
  if(values.indexOf(cur)>=0)sel.value=cur;
}
function refreshOptions(){
  var items=all();
  var brands=Array.from(new Set(items.map(function(x){return x.brand;}).filter(Boolean))).sort(function(a,b){return a.localeCompare(b,'ja');});
  var cats=Array.from(new Set(items.map(function(x){return x.category;}).filter(Boolean))).sort(catSort);
  fillSelect($('#brand'),brands,'すべてのブランド');fillSelect($('#cat'),cats,'すべてのカテゴリ');
  $('#brandList').innerHTML=brands.map(function(b){return '<option value="'+esc(b)+'">';}).join('');
  $('#catList').innerHTML=Array.from(new Set(CAT_ORDER.concat(cats))).map(function(c){return '<option value="'+esc(c)+'">';}).join('');
}

var CAT_ORDER=['ロンT','半袖T','シャツ','スウェット・パーカー','ニット','パンツ','アウター・フリース','ソックス・その他'];
function catSort(a,b){var ia=CAT_ORDER.indexOf(a),ib=CAT_ORDER.indexOf(b);if(ia<0)ia=99;if(ib<0)ib=99;return ia-ib||a.localeCompare(b,'ja');}
function renderCatbar(){
  var counts={};all().forEach(function(x){counts[x.category]=(counts[x.category]||0)+1;});
  var cats=Object.keys(counts).sort(catSort);
  var h='<button type="button" class="catchip" data-cat="" aria-pressed="'+(state.cat===''?'true':'false')+'">すべて<small>'+all().length+'</small></button>';
  cats.forEach(function(c){h+='<button type="button" class="catchip" data-cat="'+esc(c)+'" aria-pressed="'+(state.cat===c?'true':'false')+'">'+esc(c)+'<small>'+counts[c]+'</small></button>';});
  $('#catbar').innerHTML=h;
}
function filtered(){
  var q=state.q.trim().toLowerCase().normalize('NFKC');
  var r=all().filter(function(x){
    if(state.cartOnly&&!inCart(x.id))return false;
    if(state.statuses.length&&state.statuses.indexOf(x.status)<0)return false;
    if(state.brand&&x.brand!==state.brand)return false;
    if(state.cat&&x.category!==state.cat)return false;
    if(state.pmin!=null&&(x.price==null||x.price<state.pmin))return false;
    if(state.pmax!=null&&(x.price==null||x.price>state.pmax))return false;
    if(q){var hay=[x.brand,x.name,x.fabric,x.note,x.evidence,x.category,x.statusDetail,STATUS[x.status].label].join(' ').toLowerCase().normalize('NFKC');
      if(q.split(/\s+/).some(function(t){return hay.indexOf(t)<0;}))return false;}
    return true;
  });
  var P=function(x){return x.price==null?Infinity:x.price;};
  r.sort(function(a,b){
    switch(state.sort){
      case 'price-asc':return P(a)-P(b)||a._order-b._order;
      case 'price-desc':return (b.price||0)-(a.price||0)||a._order-b._order;
      case 'added':return a._order-b._order;
      default:return STATUS[a.status].rank-STATUS[b.status].rank||P(a)-P(b);
    }
  });
  return r;
}

function card(x){
  var st=STATUS[x.status];
  var onsale=x.listPrice&&x.price!=null&&x.listPrice>x.price;
  var off=onsale?Math.round((1-x.price/x.listPrice)*100):0;
  var url=safeUrl(x.url),img=safeImg(x.image)||PLACEHOLDER;
  var badgeTitle=st.label+(x.statusDetail?'：'+x.statusDetail:'');
  var ic=inCart(x.id);
  var h='<article class="card'+(ic?' incart':'')+'" data-id="'+esc(x.id)+'">';
  h+=(url?'<a class="thumb" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">':'<div class="thumb">');
  h+='<img loading="lazy" src="'+esc(img)+'" alt="'+esc(x.brand+' '+x.name)+'" onerror="this.onerror=null;this.src=PLACEHOLDER_SRC">';
  h+='<span class="badge '+st.cls+'" title="'+esc(badgeTitle)+'">'+esc(st.label)+'</span>';
  if(x._src==='user')h+='<span class="mine">追加</span>';
  if(ic)h+='<span class="incart-tag">🛒 カート</span>';
  if(onsale)h+='<span class="sale">'+off+'%OFF</span>';
  h+=(url?'</a>':'</div>');
  h+='<div class="body"><div class="brand">'+esc(x.brand)+'</div><h3 class="name">'+esc(x.name)+'</h3>';
  h+='<div class="prices">'+(x.price!=null?'<span class="now'+(onsale?' onsale':'')+'">'+yen(x.price)+'</span>':'<span class="now">価格未登録</span>')+(onsale?'<span class="list">'+yen(x.listPrice)+'</span>':'')+'</div>';
  h+='<dl class="meta">';
  if(x.fabric)h+='<dt>素材</dt><dd>'+esc(x.fabric)+'</dd>';
  h+='<dt>乾燥機</dt><dd>'+esc(x.statusDetail||st.label)+'</dd>';
  h+='<dt>カテゴリ</dt><dd>'+esc(x.category)+'</dd></dl>';
  if(x.note)h+='<p class="note">'+esc(x.note)+'</p>';
  if(x.evidence)h+='<p class="evidence"><b>根拠</b> '+esc(x.evidence)+'</p>';
  h+='<div class="actions">'+(url?'<a class="link" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">商品ページ ↗</a>':'<span class="nolink">リンクなし</span>');
  h+='<button class="cart-add'+(ic?' in':'')+'" data-act="cart" type="button" aria-pressed="'+ic+'">'+(ic?'✓ カートに入れた':'🛒 カートに入れる')+'</button>';
  if(x._src==='user')h+='<button class="btn small" data-act="edit" type="button">編集</button><button class="btn small danger" data-act="del" type="button">削除</button>';
  h+='</div></div></article>';
  return h;
}

function render(){
  renderCatbar();
  var r=filtered(),total=all().length;
  $('#grid').innerHTML=r.length?r.map(card).join(''):'<div class="empty">条件に合うアイテムがありません。<br>フィルターを変更してください。</div>';
  var c={ok:0,unknown:0,ng:0};r.forEach(function(x){c[x.status]++;});
  $('#count').textContent=r.length+' / '+total+' 件表示　（OK '+c.ok+'・未確認 '+c.unknown+'・NG '+c.ng+'）'+(state.cartOnly?'　🛒カートのみ':'');
  renderCart();
}

// --- filters ---
$('#q').addEventListener('input',function(e){state.q=e.target.value;render();});
$('#brand').addEventListener('change',function(e){state.brand=e.target.value;render();});
$('#cat').addEventListener('change',function(e){state.cat=e.target.value;render();});
$('#catbar').addEventListener('click',function(e){var b=e.target.closest('.catchip');if(!b)return;state.cat=b.dataset.cat;$('#cat').value=state.cat;render();});
$('#pmin').addEventListener('input',function(e){state.pmin=num(e.target.value);render();});
$('#pmax').addEventListener('input',function(e){state.pmax=num(e.target.value);render();});
$('#sort').addEventListener('change',function(e){state.sort=e.target.value;render();});
function toggleChip(ch){
  var on=ch.getAttribute('aria-pressed')!=='true';ch.setAttribute('aria-pressed',String(on));
  state.statuses=Array.from(document.querySelectorAll('#statusChips .chip[data-s][aria-pressed="true"]')).map(function(c){return c.dataset.s;});render();
}
document.querySelectorAll('#statusChips .chip[data-s]').forEach(function(ch){
  ch.addEventListener('click',function(){toggleChip(ch);});
  ch.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleChip(ch);}});
});
function toggleCartOnly(){var ch=$('#cartOnly');state.cartOnly=ch.getAttribute('aria-pressed')!=='true';ch.setAttribute('aria-pressed',String(state.cartOnly));render();}
$('#cartOnly').addEventListener('click',toggleCartOnly);
$('#cartOnly').addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleCartOnly();}});
$('#cartBtn').addEventListener('click',openCart);
$('#cartClose').addEventListener('click',closeCart);
$('#cartOv').addEventListener('click',closeCart);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('#cart').classList.contains('open'))closeCart();});
$('#cartList').addEventListener('click',function(e){var b=e.target.closest('button[data-act="rm"]');if(!b)return;var i=cartIdx(b.closest('.cart-item').dataset.id);if(i>=0){cart.splice(i,1);saveCart();render();toast('カートから外しました');}});
$('#cartList').addEventListener('input',function(e){if(!e.target.classList.contains('memo'))return;var i=cartIdx(e.target.closest('.cart-item').dataset.id);if(i>=0){cart[i].memo=e.target.value;saveCart();}});
$('#cartCopy').addEventListener('click',function(){if(!cartRows().length){toast('カートは空です');return;}copyText(cartText()).then(function(){toast('リストをコピーしました');},function(){window.prompt('コピーしてください',cartText());});});
$('#cartClear').addEventListener('click',function(){if(!cart.length)return;if(confirm('カートを空にしますか？')){cart=[];saveCart();render();toast('カートを空にしました');}});
$('#moreToggle').addEventListener('click',function(){$('#more').classList.toggle('open');});
$('#reset').addEventListener('click',function(){
  state={q:'',statuses:[],brand:'',cat:'',pmin:null,pmax:null,sort:'default',cartOnly:false};$('#cartOnly').setAttribute('aria-pressed','false');
  ['#q','#brand','#cat','#pmin','#pmax'].forEach(function(s){$(s).value='';});$('#sort').value='default';
  document.querySelectorAll('#statusChips .chip[data-s]').forEach(function(c){c.setAttribute('aria-pressed','false');});render();
});

// --- add / edit / delete ---
var dlg=$('#dlg'),form=$('#form');
function openForm(item){
  form.reset();$('#dlgTitle').textContent=item?'アイテム編集':'アイテム追加';
  var f=form.elements;
  if(item){['id','url','brand','category','name','price','listPrice','fabric','status','statusDetail','evidence','note','image'].forEach(function(k){f[k].value=item[k]==null?'':item[k];});}
  else{f.id.value='';f.category.value='ロンT';f.status.value='unknown';}
  updatePreview();
  if(dlg.showModal)dlg.showModal();else dlg.setAttribute('open','');
  setTimeout(function(){f[item?'name':'url'].focus();},30);
}
function closeForm(){if(dlg.close)dlg.close();else dlg.removeAttribute('open');}
function updatePreview(){var u=safeImg(form.elements.image.value);var pv=$('#pv');pv.onerror=function(){pv.onerror=null;pv.src=PLACEHOLDER;};pv.src=u||PLACEHOLDER;}
form.elements.image.addEventListener('input',updatePreview);
$('#addBtn').addEventListener('click',function(){openForm(null);});
$('#cancelBtn').addEventListener('click',closeForm);
form.addEventListener('submit',function(e){
  e.preventDefault();
  var f=form.elements,data={};
  ['id','url','brand','category','name','price','listPrice','fabric','status','statusDetail','evidence','note','image'].forEach(function(k){data[k]=f[k].value;});
  if(!data.brand.trim()||!data.name.trim()||num(data.price)==null){toast('ブランド・商品名・価格は必須です');return;}
  if(data.url&&!safeUrl(data.url)){toast('URLは http(s):// で始めてください');return;}
  var idx=user.findIndex(function(x){return x.id===data.id;});
  if(idx>=0){var it=normalize(Object.assign({},user[idx],data));it.addedAt=user[idx].addedAt;user[idx]=it;toast('更新しました');}
  else{data.id='';user.push(normalize(data));toast('追加しました');}
  saveUser();refreshOptions();render();closeForm();
});
$('#grid').addEventListener('click',function(e){
  var b=e.target.closest('button[data-act]');if(!b)return;
  if(b.dataset.act==='cart'){toggleCart(b.closest('.card').dataset.id);return;}
  var id=b.closest('.card').dataset.id,idx=user.findIndex(function(x){return x.id===id;});if(idx<0)return;
  if(b.dataset.act==='edit')openForm(user[idx]);
  else if(confirm('「'+user[idx].name+'」を削除しますか？')){user.splice(idx,1);saveUser();var ci=cartIdx(id);if(ci>=0){cart.splice(ci,1);saveCart();}refreshOptions();render();toast('削除しました');}
});

// --- export / import ---
$('#exportBtn').addEventListener('click',function(){
  var includeSeed=confirm('初期データも含めてエクスポートしますか？\n［OK］全アイテム　［キャンセル］追加分のみ');
  var items=includeSeed?all().map(function(x){var y=Object.assign({},x);delete y._src;delete y._order;return y;}):user;
  var blob=new Blob([JSON.stringify({app:'dryer-gallery',version:1,exportedAt:new Date().toISOString(),items:items,cart:cart},null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='dryer-gallery-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
  toast(items.length+'件・カート'+cart.length+'点をエクスポートしました');
});
$('#importBtn').addEventListener('click',function(){$('#importFile').click();});
$('#importFile').addEventListener('change',function(e){
  var file=e.target.files[0];if(!file)return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var d=JSON.parse(rd.result),arr=Array.isArray(d)?d:(d.items||[]);
      if(!Array.isArray(arr))throw new Error('format');
      var seedIds=new Set(seed.map(function(x){return x.id;})),added=0,updated=0;
      arr.forEach(function(raw){
        if(!raw||!raw.name||!raw.brand)return;
        if(seedIds.has(raw.id))return; // 初期データは取り込まない
        var it=normalize(raw),i=user.findIndex(function(x){return x.id===it.id;});
        if(i>=0){user[i]=it;updated++;}else{user.push(it);added++;}
      });
      var cAdded=0;
      if(d&&Array.isArray(d.cart)){d.cart.forEach(function(c){if(!c||!c.id)return;var i=cartIdx(String(c.id));if(i>=0){if(c.memo)cart[i].memo=String(c.memo);}else{cart.push({id:String(c.id),memo:String(c.memo||''),addedAt:c.addedAt||new Date().toISOString()});cAdded++;}});saveCart();}
      saveUser();refreshOptions();render();toast('インポート：追加 '+added+'件・更新 '+updated+'件・カート '+cAdded+'点');
    }catch(err){toast('JSONを読み込めませんでした');}
    e.target.value='';
  };
  rd.readAsText(file);
});

// --- boot ---
window.PLACEHOLDER_SRC=PLACEHOLDER;
function boot(data){seed=(data&&data.items||[]).map(function(x){var n=normalize(x);n.id=x.id;return n;});user=loadUser();cart=loadCart();refreshOptions();render();}
var inline=null;try{inline=JSON.parse(document.getElementById('seed-data').textContent);}catch(e){}
if(location.protocol.indexOf('http')===0&&!false){
  fetch('data.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(boot).catch(function(){boot(inline);});
}else{boot(inline);}
})();
</script>
</body>
